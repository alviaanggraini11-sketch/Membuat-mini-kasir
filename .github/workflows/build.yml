
name: Build C++ EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++
        run: |
         g++ -x c++ Vivi -o Vivi.exe -std=c++17 -static

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Vivi-Windows
          path: Vivi.exe
